# AG-VAULT — production compose.
# The master key and admin hash are required (fail-closed).
# Generate:  openssl rand -hex 32
# Admin hash: docker run --rm ag-vault hashpw   (see README)
#
# SPDX-License-Identifier: AGPL-3.0

name: ag-vault

networks:
  proxy:
    name: proxy
    external: true

services:
  ag-vault:
    build: .
    # image: ghcr.io/kervia/ag-vault:latest
    container_name: ag-vault
    restart: unless-stopped
    environment:
      AGENTVAULT_LISTEN: 0.0.0.0:8321
      AGENTVAULT_DB: /data/agentvault.db
      AGENTVAULT_MASTER_KEY: ${AGENTVAULT_MASTER_KEY}
      AGENTVAULT_ADMIN_HASH: ${AGENTVAULT_ADMIN_HASH}
      AGENTVAULT_RATE_PER_MIN: "60"
    volumes:
      - ./data:/data
    networks:
      - proxy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true