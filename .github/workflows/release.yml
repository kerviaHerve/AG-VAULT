name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # webui first — go:embed needs internal/web/dist to exist
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Build webui
        working-directory: web-app
        run: |
          npm ci
          npx vite build

      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }

      - name: Build static binaries (amd64 + arm64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o build/agentvault ./cmd/agentvault
            tar -czf "agentvault-linux-${ARCH}.tar.gz" -C build agentvault
            rm -f build/agentvault
          done
          sha256sum agentvault-linux-*.tar.gz > agentvault_checksums.txt
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Release notes: extract this tag's section from CHANGELOG.md
      # (between "## <tag>" and the next "## " line) + install reminder.
      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'EOF'
          import re, os, sys
          tag = os.environ["GITHUB_REF_NAME"]
          src = open("CHANGELOG.md").read()
          m = re.search(r"## " + re.escape(tag) + r"\s*\((.*?)\)\s*\n(.*?)(?=\n## |\n---)", src, re.S)
          if not m:
              sys.exit("CHANGELOG.md has no '## " + tag + "' section")
          date, body = m.groups()
          notes = "AG-VAULT " + tag + " — " + date + "\n\n" + body.strip() + "\n\n---\n\n## Install\n\n```bash\nsudo bash install.sh\n```\n\nThe installer verifies the sha256 checksum before installing.\nUpdates: webui → Settings → Version → *Update now* (self-update, data untouched).\n\nFull history: CHANGELOG.md"
          open("RELEASE_NOTES.md", "w").write(notes)
          print("RELEASE_NOTES.md:", len(notes), "chars")
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "AG-VAULT v${{ env.RELEASE_VERSION }}"
          files: |
            agentvault-linux-amd64.tar.gz
            agentvault-linux-arm64.tar.gz
            agentvault_checksums.txt
          body_path: RELEASE_NOTES.md
      - name: Verify release assets are downloadable
        run: |
          sleep 5
          ARCH=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          curl -sfL "https://github.com/kerviaHerve/AG-VAULT/releases/latest/download/agentvault_checksums.txt" -o /tmp/sums.txt
          grep "agentvault-linux-${ARCH}.tar.gz" /tmp/sums.txt